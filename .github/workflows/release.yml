name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npx tsc -b && npx vite build

      - name: Build Electron
        run: npx electron-builder --win --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          body: |
            ## TestFlow ${{ github.ref_name }}
            
            Windows 离线安装包，无需 Node.js 环境即可运行。
            
            ### 安装
            运行 `TestFlow Setup *.exe` 按提示安装。
            
            ### 变更
            查看 [提交历史](https://github.com/UyNewNas/TestFlow/commits/${{ github.ref_name }})
          draft: false
          prerelease: false
