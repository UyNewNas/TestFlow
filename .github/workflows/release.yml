name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Detect release type
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '-beta') {
            Write-Output "IS_BETA=true" >> $env:GITHUB_OUTPUT
            Write-Output "LABEL=Beta" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "IS_BETA=false" >> $env:GITHUB_OUTPUT
            Write-Output "LABEL=Stable" >> $env:GITHUB_OUTPUT
          }

      - name: Install dependencies
        run: npm ci

      - name: Build Vite
        run: npx tsc -b && npx vite build

      - name: Inject version into package.json
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          # ensure semver-compatible: 0.1-beta -> 0.1.0-beta
          if ($ver -notmatch '^\d+\.\d+\.\d+') {
            $parts = $ver -split '-'
            if ($parts[0] -match '^\d+\.\d+$') {
              $ver = $parts[0] + '.0' + $(if ($parts.Count -gt 1) { '-' + ($parts[1..($parts.Count-1)] -join '-') } else { '' })
            }
          }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 32 | Set-Content package.json
          Write-Host "Version set to $ver"

      - name: Build Electron
        run: npx electron-builder --win --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          body: |
            ## TestFlow ${{ github.ref_name }} (${{ steps.meta.outputs.LABEL }})
            
            Windows 离线安装包，无需 Node.js 环境即可运行。
            
            ### 安装
            运行 `TestFlow Setup *.exe` 按提示安装。
            
            ### 变更
            查看 [提交历史](https://github.com/UyNewNas/TestFlow/commits/${{ github.ref_name }})
            
            > 自动构建于 `${{ github.ref_name }}` 标签
          draft: false
          prerelease: ${{ steps.meta.outputs.IS_BETA }}
